name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  build-apk:
    name: Sestavit instalační Selectra.apk a vydat aktualizaci
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repozitáře
        uses: actions/checkout@v4

      - name: Nastavení Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Nastavení Java 21 (JDK)
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Výpočet verze pro automatické aktualizace
        run: |
          VERSION_CODE=$((300 + GITHUB_RUN_NUMBER))
          VERSION_NAME="2.15.${GITHUB_RUN_NUMBER}"
          RELEASE_TAG="v${VERSION_NAME}"
          echo "ANDROID_VERSION_CODE=$VERSION_CODE" >> "$GITHUB_ENV"
          echo "ANDROID_VERSION_NAME=$VERSION_NAME" >> "$GITHUB_ENV"
          echo "RELEASE_TAG=$RELEASE_TAG" >> "$GITHUB_ENV"
          echo "VITE_APP_VERSION=$RELEASE_TAG" >> "$GITHUB_ENV"
          echo "VITE_APP_BUILD_NUMBER=$GITHUB_RUN_NUMBER" >> "$GITHUB_ENV"
          echo "VITE_GITHUB_REPO=${GITHUB_REPOSITORY}" >> "$GITHUB_ENV"
          echo "Připravuji vydání $RELEASE_TAG (Android versionCode: $VERSION_CODE) pro repozitář ${GITHUB_REPOSITORY}"

      - name: Nastavení Android SDK a potvrzení licencí
        run: |
          SDK_DIR="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}}"
          echo "ANDROID_HOME=$SDK_DIR" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$SDK_DIR" >> "$GITHUB_ENV"

          SDKMANAGER=""
          if [ -x "$SDK_DIR/cmdline-tools/latest/bin/sdkmanager" ]; then
            SDKMANAGER="$SDK_DIR/cmdline-tools/latest/bin/sdkmanager"
          else
            SDKMANAGER=$(find "$SDK_DIR/cmdline-tools" -name sdkmanager -type f 2>/dev/null | sort -V | tail -n 1)
          fi

          if [ -n "$SDKMANAGER" ]; then
            yes | "$SDKMANAGER" --sdk_root="$SDK_DIR" --licenses > /dev/null || true
            "$SDKMANAGER" --sdk_root="$SDK_DIR" "platform-tools" "platforms;android-36" > /dev/null || true
          fi

      - name: Cache trvalého podpisového klíče (aby zůstával stejný otisk SHA-1)
        uses: actions/cache@v4
        with:
          path: ~/.selectra-keystore
          key: selectra-android-signing-keystore-v1

      - name: Příprava podpisového klíče a výpis SHA-1 pro Firebase
        id: keystore
        env:
          SECRET_KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          SECRET_STORE_PASS: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          SECRET_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          SECRET_KEY_PASS: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          mkdir -p ~/.selectra-keystore
          KS_PATH="$HOME/.selectra-keystore/selectra-release.keystore"
          STORE_PASS="${SECRET_STORE_PASS:-SelectraAndroid2026!}"
          KEY_ALIAS="${SECRET_KEY_ALIAS:-selectra}"
          KEY_PASS="${SECRET_KEY_PASS:-SelectraAndroid2026!}"

          if [ -n "$SECRET_KEYSTORE_B64" ]; then
            echo "$SECRET_KEYSTORE_B64" | base64 --decode > "$KS_PATH"
            KEY_SOURCE="GitHub Secret ANDROID_KEYSTORE_BASE64 (trvale uzamčeno)"
          elif [ ! -f "$KS_PATH" ]; then
            keytool -genkeypair -v \
              -keystore "$KS_PATH" \
              -alias "$KEY_ALIAS" \
              -keyalg RSA \
              -keysize 2048 \
              -validity 10000 \
              -storepass "$STORE_PASS" \
              -keypass "$KEY_PASS" \
              -dname "CN=Selectra, OU=Mobile, O=Selectra, L=Prague, S=CZ, C=CZ"
            KEY_SOURCE="Nově vygenerováno (uloženo do cache)"
          else
            KEY_SOURCE="Načteno z GitHub Actions cache"
          fi

          echo "ANDROID_KEYSTORE_PATH=$KS_PATH" >> "$GITHUB_ENV"
          echo "ANDROID_KEYSTORE_PASSWORD=$STORE_PASS" >> "$GITHUB_ENV"
          echo "ANDROID_KEY_ALIAS=$KEY_ALIAS" >> "$GITHUB_ENV"
          echo "ANDROID_KEY_PASSWORD=$KEY_PASS" >> "$GITHUB_ENV"

          SHA1=$(keytool -exportcert -alias "$KEY_ALIAS" -keystore "$KS_PATH" -storepass "$STORE_PASS" | openssl dgst -sha1 -c | awk '{print toupper($NF)}')
          SHA256=$(keytool -exportcert -alias "$KEY_ALIAS" -keystore "$KS_PATH" -storepass "$STORE_PASS" | openssl dgst -sha256 -c | awk '{print toupper($NF)}')

          echo "========================================================"
          echo "PODPISOVÝ KLÍČ APK ($KEY_SOURCE)"
          echo "ID balíčku: com.selectra.app"
          echo "SHA-1 otisk pro Firebase: $SHA1"
          echo "SHA-256 otisk:            $SHA256"
          echo "========================================================"

          {
            echo "## Selectra Android APK ($RELEASE_TAG)"
            echo ""
            echo "- **Verze balíčku:** \`$RELEASE_TAG\` (\`versionCode: $ANDROID_VERSION_CODE\`)"
            echo "- **Zdroj podpisového klíče:** $KEY_SOURCE"
            echo "- **ID balíčku (Package name):** \`com.selectra.app\`"
            echo "- **SHA-1 otisk (pro Firebase Console):** \`$SHA1\`"
            echo "- **SHA-256 otisk:** \`$SHA256\`"
            echo ""
          } >> "$GITHUB_STEP_SUMMARY"

          if [ -z "$SECRET_KEYSTORE_B64" ]; then
            KS_B64=$(base64 -w 0 "$KS_PATH")
            {
              echo "<details>"
              echo "<summary><strong>Doporučeno: Jak jednorázově uzamknout podpisový klíč natrvalo (aby aktualizacím nikdy nevypršela cache)</strong></summary>"
              echo ""
              echo "GitHub maže dočasnou cache po 7 dnech nečinnosti. Aby šla aplikace v telefonu vždy přeinstalovat jedním klepnutím a nikdy se nezměnil otisk \`SHA-1\`, uložte níže uvedený text v repozitáři do **Settings → Secrets and variables → Actions → New repository secret** pod názvem \`ANDROID_KEYSTORE_BASE64\`:"
              echo ""
              echo "\`\`\`text"
              echo "$KS_B64"
              echo "\`\`\`"
              echo "</details>"
              echo ""
            } >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Instalace závislostí a příprava Capacitor Android projektu
        run: |
          npm install --no-audit --no-fund --legacy-peer-deps
          npm run android:prepare

      - name: Volitelné vložení google-services.json ze Secrets
        env:
          GOOGLE_SERVICES_JSON: ${{ secrets.GOOGLE_SERVICES_JSON }}
        run: |
          if [ -n "$GOOGLE_SERVICES_JSON" ]; then
            printf '%s' "$GOOGLE_SERVICES_JSON" > android/app/google-services.json
          fi

      - name: Sestavení podepsaného instalačního APK (Gradle Release)
        working-directory: android
        run: |
          printf 'sdk.dir=%s\n' "$ANDROID_HOME" > local.properties
          chmod +x gradlew
          ./gradlew assembleRelease --no-daemon
          cp app/build/outputs/apk/release/app-release.apk ../Selectra.apk

      - name: Vydání aktualizace na GitHub Releases (pro 1-tap aktualizaci v aplikaci)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          COMMIT_MSG=$(git log -1 --pretty=%s)
          NOTES="Automatické sestavení mobilní aplikace Selectra (${RELEASE_TAG}).

          Poslední změna: ${COMMIT_MSG}
          versionCode: ${ANDROID_VERSION_CODE}"

          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            gh release upload "$RELEASE_TAG" Selectra.apk --clobber
          else
            gh release create "$RELEASE_TAG" Selectra.apk \
              --title "Selectra ${RELEASE_TAG}" \
              --notes "$NOTES" \
              --latest
          fi

      - name: Nahrání instalačního souboru Selectra.apk do Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: Selectra-Android-APK
          path: Selectra.apk
          if-no-files-found: error
          retention-days: 30
